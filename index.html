<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bryan Phun – Digital Name Card</title>
<style>
  :root {
    --bg: #f4efe9;
    --card: #ffffff;
    --ink: #1f1b24;
    --muted: #6d6677;
    --accent: #b4476b;
    --accent-ink: #ffffff;
    --line: #e8e1da;
    --shadow: 0 20px 50px -20px rgba(60, 30, 50, .35);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17141b;
      --card: #221e29;
      --ink: #f3eef6;
      --muted: #a79fb2;
      --accent: #e0749a;
      --accent-ink: #1a1220;
      --line: #36303f;
      --shadow: 0 20px 50px -20px rgba(0, 0, 0, .7);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px 16px;
    background: var(--bg);
    color: var(--ink);
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  }
  .card {
    width: 100%;
    max-width: 380px;
    background: var(--card);
    border-radius: 24px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .banner {
    height: 150px;
    background: linear-gradient(135deg, var(--accent), #6b4a9e);
    background-size: cover;
    background-position: center;
    position: relative;
  }
  .slide {
    position: absolute; inset: 0;
    background-size: cover; background-position: center;
    opacity: 0; transition: opacity 1s ease;
  }
  .slide.on { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { .slide { transition: none; } }
  .banner.has-img::after {
    z-index: 1; pointer-events: none;
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(to bottom, rgba(0,0,0,.05), rgba(0,0,0,.35));
  }
  .body { padding: 0 28px 28px; text-align: center; }
  .avatar {
    width: 150px; height: 150px;
    margin: -75px auto 14px;
    position: relative; z-index: 1;
    border-radius: 50%;
    border: 4px solid var(--card);
    background: #efe9e1 url("logo.png") no-repeat center 18% / 92%;
    color: var(--accent-ink);
    display: grid; place-items: center;
    font-size: 34px; font-weight: 600;
    overflow: hidden;
  }
  .avatar img { width: 100%; height: 100%; object-fit: contain; object-position: center bottom; transform: translateY(16%) scale(.82); transform-origin: center bottom; }
  h1 { margin: 0; font-size: 1.5rem; letter-spacing: -.01em; }
  .title { margin: 4px 0 0; color: var(--accent); font-weight: 600; font-size: .95rem; }
  .bio { margin: 14px 0 0; color: var(--muted); font-size: .92rem; line-height: 1.5; }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 22px 0 8px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    padding: 12px 10px; border-radius: 12px;
    border: 1px solid var(--line); background: transparent; color: var(--ink);
    font: inherit; font-weight: 600; font-size: .9rem;
    cursor: pointer; text-decoration: none;
  }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); grid-column: 1 / -1; }
  .btn:hover { filter: brightness(1.06); }
  .btn:focus-visible, .row:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .list { margin-top: 14px; text-align: left; border-top: 1px solid var(--line); }
  .row {
    display: flex; gap: 14px; align-items: center;
    padding: 13px 4px; border-bottom: 1px solid var(--line);
    color: inherit; text-decoration: none;
  }
  .row .k { width: 76px; flex: none; font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .row .v { font-size: .95rem; word-break: break-word; }
  /* ---------- Opening ---------- */
  #intro {
    position: fixed; inset: 0; z-index: 100; overflow: hidden;
    background: radial-gradient(ellipse at 50% 60%, #6a3511 0%, #2b1608 55%, #120a04 100%);
    color: #fff3df; cursor: pointer;
    transition: transform .9s cubic-bezier(.76,0,.24,1), opacity .4s ease .6s;
  }
  #intro.leave { transform: translateY(-100%); opacity: 0; }
  #intro .glow {
    position: absolute; left: 50%; top: 52%; width: 120vmax; height: 120vmax;
    transform: translate(-50%, -50%);
    background: conic-gradient(from 0deg, transparent, rgba(255,170,60,.16), transparent 30%, rgba(255,120,60,.10), transparent 60%, rgba(255,200,90,.14), transparent);
    animation: spin 14s linear infinite;
  }
  @keyframes spin { to { transform: translate(-50%, -50%) rotate(360deg); } }

  .bubble {
    position: absolute; bottom: -30px; border-radius: 50%;
    border: 1px solid rgba(255,225,170,.55);
    background: radial-gradient(circle at 30% 30%, rgba(255,240,205,.55), rgba(255,200,110,.05) 65%);
    animation: rise linear infinite;
  }
  @keyframes rise {
    0% { transform: translateY(0) translateX(0) scale(.6); opacity: 0; }
    12% { opacity: 1; }
    100% { transform: translateY(-115vh) translateX(var(--dx, 20px)) scale(1.1); opacity: 0; }
  }

  /* rising wall of real product photos */
  #intro { --g: clamp(10px, 2.2vw, 22px); }
  .wall {
    position: absolute; left: 50%; top: -12%; width: min(150vw, 1180px); height: 135%;
    display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--g);
    transform: translateX(-50%) translateY(70vh) rotate(-9deg); opacity: 0;
  }
  #intro.go .wall { animation: wallIn 1.8s cubic-bezier(.16,.84,.24,1) forwards; }
  @keyframes wallIn {
    from { transform: translateX(-50%) translateY(75vh) rotate(-9deg); opacity: 0; }
    to   { transform: translateX(-50%) translateY(0) rotate(-9deg); opacity: 1; }
  }
  .col { display: flex; flex-direction: column; will-change: transform; }
  #intro.go .col { animation: colUp var(--d) linear infinite; }
  .col:nth-child(2) { margin-top: -22%; }
  .col:nth-child(3) { margin-top: -8%; }
  @keyframes colUp { to { transform: translateY(-50%); } }
  .tile {
    position: relative; aspect-ratio: 1; margin-bottom: var(--g);
    border-radius: 20px; overflow: hidden; background: #2b1608;
    box-shadow: 0 22px 44px rgba(0,0,0,.55);
  }
  .tile img { width: 100%; height: 100%; display: block; object-fit: cover; }
  .tile b {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 22px 10px 9px; text-align: center;
    font: 700 clamp(9px, 2.4vw, 13px)/1.1 "Segoe UI", system-ui, sans-serif; letter-spacing: .14em;
    text-transform: uppercase; color: #fff3df;
    background: linear-gradient(to top, rgba(18,10,4,.85), transparent);
  }
  .shade {
    position: absolute; inset: 0; opacity: 0; pointer-events: none;
    background:
      radial-gradient(ellipse 80% 42% at 50% 50%, rgba(14,8,3,.9) 0%, rgba(14,8,3,.62) 55%, transparent 100%),
      linear-gradient(to bottom, rgba(14,8,3,.55), transparent 22%, transparent 78%, rgba(14,8,3,.7));
  }
  #intro.go .shade { animation: fadeIn .9s ease 1.1s forwards; }
  @keyframes fadeIn { to { opacity: 1; } }

  .ticker {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 0; overflow: hidden;
    background: linear-gradient(90deg, #b8651b, #e59a35, #b8651b);
    transform: translateY(100%);
  }
  #intro.go .ticker { animation: slideUp .7s cubic-bezier(.2,.9,.3,1) 1.4s forwards; }
  @keyframes slideUp { to { transform: none; } }
  .ticker div {
    width: max-content; white-space: nowrap; animation: mqL 22s linear infinite;
    font: 800 13px/1 "Segoe UI", system-ui, sans-serif; letter-spacing: .22em;
    text-transform: uppercase; color: #1c0f06;
  }
  .ticker i { font-style: normal; padding: 0 1.1em; opacity: .65; }
  @keyframes mqL { from { transform: translateX(0); } to { transform: translateX(-50%); } }

  .brand {
    position: absolute; inset: 0; display: grid; place-content: center; text-align: center;
    pointer-events: none; padding: 0 16px 36px;
  }
  .brand .kick {
    margin: 0 0 14px; font-size: clamp(11px, 3vw, 14px); letter-spacing: .38em; text-transform: uppercase;
    color: #ffc982; opacity: 0;
  }
  #intro.go .brand .kick { animation: fadeUp .8s ease 1.4s forwards; }
  .brand h2 {
    margin: 0; font: 800 clamp(44px, 13.5vw, 84px)/1 "Segoe UI", system-ui, sans-serif;
    letter-spacing: .06em; text-transform: uppercase;
    text-shadow: 0 6px 40px rgba(255,140,40,.6);
  }
  .brand h2 .w { display: inline-block; white-space: nowrap; }
  .brand h2 .w span { display: inline-block; opacity: 0; transform: translateY(46px) scale(.7) rotate(-8deg); }
  #intro.go .brand h2 .w span {
    animation: pop .7s cubic-bezier(.2,1.4,.4,1) forwards;
    animation-delay: calc(1.7s + var(--i) * .07s);
  }
  @keyframes pop { to { opacity: 1; transform: none; } }
  .brand .rule {
    height: 2px; width: 0; margin: 18px auto 0; background: linear-gradient(90deg, transparent, #ffb347, transparent);
  }
  #intro.go .brand .rule { animation: grow 1s ease 2.6s forwards; }
  @keyframes grow { to { width: min(300px, 72vw); } }
  .brand .chips { margin-top: 18px; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .brand .chips span {
    padding: 7px 13px; border-radius: 999px; font-size: clamp(11px, 3vw, 13px); font-weight: 600; letter-spacing: .06em;
    color: #ffe2b4; border: 1px solid rgba(255,190,100,.55); background: rgba(255,170,60,.12);
    opacity: 0; transform: translateY(14px);
  }
  #intro.go .brand .chips span { animation: fadeUp .6s ease forwards; animation-delay: calc(3s + var(--c) * .22s); }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  #intro .skip {
    position: absolute; right: 16px; top: 16px; z-index: 2; font-size: .78rem; letter-spacing: .12em;
    text-transform: uppercase; color: rgba(255,243,223,.7); text-shadow: 0 1px 6px rgba(0,0,0,.6);
  }
  @media (prefers-reduced-motion: reduce) { #intro { display: none; } }

  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px);
    background: var(--ink); color: var(--bg);
    padding: 10px 18px; border-radius: 999px; font-size: .88rem;
    opacity: 0; pointer-events: none; transition: .25s;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>

<div id="intro" aria-hidden="true">
  <div class="glow"></div>
  <div class="wall" id="wall"></div>
  <div class="shade"></div>
  <div class="brand">
    <p class="kick">Handcrafted Kombucha</p>
    <h2 id="introTitle"></h2>
    <div class="rule"></div>
    <div class="chips">
      <span style="--c:0">Kombucha</span><span style="--c:1">Fermented food &amp; drink</span><span style="--c:2">Workshops</span><span style="--c:3">Corporate gifts</span>
    </div>
  </div>
  <div class="ticker"><div id="ticker"></div></div>
  <div class="skip">Tap to skip</div>
</div>

<main class="card">
  <div class="banner" id="banner"></div>
  <div class="body">
    <div class="avatar" id="avatar"></div>
    <h1 id="name"></h1>
    <p class="title" id="title"></p>
    <p class="bio" id="bio"></p>

    <div class="actions">
      <button class="btn primary" id="save">Save to contacts</button>
      <button class="btn" id="copy">Copy email</button>
      <button class="btn" id="share">Share card</button>
    </div>

    <div class="list" id="list"></div>
  </div>
</main>
<div class="toast" id="toast" role="status"></div>

<script>
// ✏️ EDIT YOUR DETAILS HERE — leave a field as "" to hide it.
const ME = {
  firstName: "Bryan",
  lastName: "Phun",
  title: "Director",
  company: "Brew By Root",
  bio: "| Kombucha | Fermented food & drink | Workshops | Corporate gifts |",
  email: "bryan.phun@gmail.com",
  phone: "+60 11-2779 6201",
  website: "https://www.brewbyroot.com/",
  facebook: "https://www.facebook.com/brewbyroot",
  instagram: "https://www.instagram.com/brewbyroot/",
  whatsappMessage: "Hello mate, greeting from TT360",
  whatsapp: "601127796201",        // digits only with country code, e.g. 60123456789
  locations: [
    { label: "JB", address: "30, Jalan Sutera 2, Taman Sutera, 81200 Johor Bahru, Johor" },
    { label: "KL", address: "No.58-3, Jalan 5/101c, Cheras Business Centre, 56100 Kuala Lumpur, Wilayah Persekutuan Kuala Lumpur" }
  ],
  contactPhoto: "contact.jpg",   // square photo saved into the phone book
  photo: "bryan.png",  // optional image URL or file path, e.g. "me.jpg"
  covers: ["cover/cover0.jpg", "cover/cover1.jpg", "cover/cover2.jpg", "cover/cover3.jpg"]  // banner slideshow; [] for plain gradient
};

const $ = id => document.getElementById(id);
const fullName = [ME.firstName, ME.lastName].filter(Boolean).join(" ");

$("name").textContent = fullName;
$("title").textContent = [ME.title, ME.company].filter(Boolean).join(" · ");
$("bio").textContent = ME.bio;
$("bio").hidden = !ME.bio;

if (ME.covers.length) {
  const banner = $("banner");
  banner.classList.add("has-img");
  const slides = ME.covers.map((src, i) => {
    const s = document.createElement("div");
    s.className = "slide" + (i === 0 ? " on" : "");
    s.style.backgroundImage = `url("${src}")`;
    banner.appendChild(s);
    return s;
  });
  let cur = 0;
  if (slides.length > 1) setInterval(() => {
    slides[cur].classList.remove("on");
    cur = (cur + 1) % slides.length;
    slides[cur].classList.add("on");
  }, 3500);
}

const av = $("avatar");
if (ME.photo) {
  const img = new Image(); img.alt = fullName; img.src = ME.photo;
  img.onerror = () => { av.textContent = initials(); };
  av.appendChild(img);
} else av.textContent = initials();
function initials() {
  return (ME.firstName[0] || "") + (ME.lastName[0] || "");
}

const rows = [
  ["Email", ME.email, ME.email && `mailto:${ME.email}`],
  ["Phone", ME.phone, ME.phone && `tel:${ME.phone.replace(/\s/g, "")}`],
  ["WhatsApp", ME.whatsapp && "Message me", ME.whatsapp && `https://wa.me/${ME.whatsapp}?text=${encodeURIComponent(ME.whatsappMessage)}`],
  ["Website", ME.website && ME.website.replace(/^https?:\/\//, ""), ME.website],
  ["Facebook", ME.facebook && "@brewbyroot", ME.facebook],
  ["Instagram", ME.instagram && "@brewbyroot", ME.instagram],
  ...ME.locations.map(l => [l.label, l.address, `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(l.address)}`])
].filter(r => r[1]);

for (const [k, v, href] of rows) {
  const el = document.createElement(href ? "a" : "div");
  el.className = "row";
  if (href) { el.href = href; if (href.startsWith("http")) { el.target = "_blank"; el.rel = "noopener"; } }
  el.innerHTML = `<span class="k"></span><span class="v"></span>`;
  el.children[0].textContent = k;
  el.children[1].textContent = v;
  $("list").appendChild(el);
}

function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 1800);
}

// Square photo saved into the phone book entry (vCard PHOTO, base64 JPEG)
async function contactPhoto() {
  try {
    const blob = await (await fetch(ME.contactPhoto)).blob();
    const dataUrl = await new Promise((res, rej) => {
      const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(blob);
    });
    const b64 = dataUrl.split(",")[1];
    const folded = b64.match(/.{1,74}/g).join("\r\n ");
    return `PHOTO;ENCODING=b;TYPE=JPEG:${folded}`;
  } catch { return null; }
}

$("save").onclick = async () => {
  const photo = ME.contactPhoto ? await contactPhoto() : null;
  const lines = [
    "BEGIN:VCARD", "VERSION:3.0",
    `N:${ME.lastName};${ME.firstName};;;`,
    `FN:${fullName}`,
    photo,
    ME.company && `ORG:${ME.company}`,
    ME.title && `TITLE:${ME.title}`,
    ME.email && `EMAIL;TYPE=INTERNET:${ME.email}`,
    ME.phone && `TEL;TYPE=CELL:${ME.phone}`,
    ME.website && `URL:${ME.website}`,
    ...ME.locations.map(l => `ADR;TYPE=WORK:;;${l.address.replace(/,/g, "\\,")};;;;`),
    "END:VCARD"
  ].filter(Boolean).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([lines], { type: "text/vcard" }));
  a.download = `${fullName.replace(/\s+/g, "_")}.vcf`;
  a.click(); URL.revokeObjectURL(a.href);
  toast("Contact file downloaded");
};

$("copy").onclick = async () => {
  try { await navigator.clipboard.writeText(ME.email); toast("Email copied"); }
  catch { toast(ME.email); }
};

$("share").onclick = async () => {
  const data = { title: fullName, text: `${fullName} – ${ME.title}`, url: location.href };
  try {
    if (navigator.share) await navigator.share(data);
    else { await navigator.clipboard.writeText(location.href); toast("Link copied"); }
  } catch {}
};
if (!ME.email) $("copy").hidden = true;

// ---------- Opening animation ----------
(function intro() {
  const el = $("intro");
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) { el.remove(); return; }
  document.body.style.overflow = "hidden";

  const FLAVOURS = ["Jun Tea", "Chrysanthemum", "Roselle", "Rooibos Raspberry", "Jasmine Osmanthus",
    "Rosemary Raspberry", "Jasmine Rose", "Original Black Tea", "Bentong Ginger", "Dragon Fruit"];

  // rising wall: 3 columns of the real product photos, each looping upward at its own speed
  const durations = [18, 13, 22];
  const imgs = [];
  durations.forEach((dur, c) => {
    const col = document.createElement("div");
    col.className = "col";
    col.style.setProperty("--d", dur + "s");
    for (let round = 0; round < 2; round++) {          // two identical sets = seamless loop
      for (let k = 0; k < FLAVOURS.length; k++) {
        const n = (k + c * 3) % FLAVOURS.length;
        const t = document.createElement("div");
        t.className = "tile";
        const im = new Image();
        im.src = `products/p${n + 1}.jpg`; im.alt = ""; im.decoding = "async";
        imgs.push(im);
        const b = document.createElement("b"); b.textContent = FLAVOURS[n];
        t.append(im, b);
        col.appendChild(t);
      }
    }
    $("wall").appendChild(col);
  });

  // flavour ticker
  const tk = FLAVOURS.map(f => `${f}<i>✦</i>`).join("");
  $("ticker").innerHTML = tk + tk;

  // title, letter by letter
  let n = 0;
  "Brew By Root".split(" ").forEach(word => {
    const w = document.createElement("span");
    w.className = "w";
    [...word].forEach(ch => {
      const s = document.createElement("span");
      s.style.setProperty("--i", n++);
      s.textContent = ch;
      w.appendChild(s);
    });
    $("introTitle").appendChild(w);
    $("introTitle").appendChild(document.createTextNode(" "));
    n++;
  });

  // fizz bubbles
  for (let i = 0; i < 28; i++) {
    const b = document.createElement("span");
    const size = 6 + Math.random() * 20;
    b.className = "bubble";
    b.style.cssText = `left:${Math.random() * 100}%;width:${size}px;height:${size}px;` +
      `animation-duration:${3 + Math.random() * 4}s;animation-delay:${Math.random() * 3}s;` +
      `--dx:${(Math.random() - .5) * 80}px`;
    el.insertBefore(b, $("wall").nextSibling);
  }

  let done = false;
  const finish = () => {
    if (done) return; done = true;
    el.classList.add("leave");
    document.body.style.overflow = "";
    setTimeout(() => el.remove(), 1400);
  };
  el.addEventListener("click", finish);

  // start once the photos are in (max 2.5s wait), so nothing pops in half-way
  const ready = Promise.all(imgs.slice(0, 10).map(im => im.decode ? im.decode().catch(() => {}) : 0));
  Promise.race([ready, new Promise(r => setTimeout(r, 2500))]).then(() => {
    el.classList.add("go");
    setTimeout(finish, 7200);
  });
})();
</script>
</body>
</html>
